name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo. Nothing here publishes, comments, or writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.x is the floor `engines` declares, because the suite runs TypeScript
        # directly via --experimental-strip-types (Node >=22.6). 24.x guards against
        # the flag's behaviour changing now that type stripping is on by default.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm test` already includes this file, so the step is not about coverage -- it
      # is about the runner. The differential suite is the resolver's only external
      # check, and it needs `claude` plus registered projects, neither of which exists
      # here; for months it skipped as one unit and CI reported green regardless.
      # Running it alone, with HOME pointed somewhere empty, reproduces exactly the
      # conditions that used to hide it and names the gate in the job log.
      - name: Differential gate (replay, no CLI)
        run: |
          mkdir -p "$RUNNER_TEMP/empty-home"
          HOME="$RUNNER_TEMP/empty-home" \
            node --experimental-strip-types --test test/differential.test.ts

      - name: Build
        run: npm run build

      # The CLI is the deliverable, and nothing in the suite imports it -- a broken
      # import or a top-level throw would ship green without this.
      - name: CLI smoke test
        run: node dist/src/cli.js help

  # The other two plugins in this marketplace are not TypeScript, so the suite above
  # says nothing about them. Neither check needs a dependency: session-fleet imports
  # stdlib only (its requirements.txt serves the menu-bar app alone), and
  # project-optimizer is bash. Both are syntax gates -- they catch a file that cannot
  # load at all, which is the failure a monorepo makes easy to ship unnoticed.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: session-fleet compiles
        run: python3 -m compileall -q plugins/session-fleet

      # `bash -n` is a PARSE check and not a correctness one. Verified by mutation: an
      # unterminated `if`, an unclosed quote and an unclosed function brace each exit 2,
      # but `if [ -z "$x" ; then :; fi` exits 0 -- `[` is a command, so a missing `]` is
      # a runtime error this cannot see. The step name says "parse" for that reason.
      - name: project-optimizer scripts parse
        run: |
          for f in plugins/project-optimizer/scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      # A manifest that stops validating is a plugin nobody can install, and none of
      # the checks above would notice.
      - name: Manifests validate
        run: |
          for m in .claude-plugin/plugin.json \
                   .claude-plugin/marketplace.json \
                   plugins/project-optimizer/.claude-plugin/plugin.json \
                   plugins/session-fleet/.claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$m" || exit 1
            echo "ok $m"
          done
