name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo. Nothing here publishes, comments, or writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.x is the floor `engines` declares, because the suite runs TypeScript
        # directly via --experimental-strip-types (Node >=22.6). 24.x guards against
        # the flag's behaviour changing now that type stripping is on by default.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The CLI is the deliverable, and nothing in the suite imports it -- a broken
      # import or a top-level throw would ship green without this.
      - name: CLI smoke test
        run: node dist/cli.js help
